services:
  rust-bs:
    build:
      context: https://github.com/boxifyuser/rust-bs.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    # Portas expostas internamente — mapeie no Easypanel (aba Ports), nao aqui
    expose:
      - "28015/tcp"
      - "28015/udp"
      - "28016/tcp"
      - "28017/udp"
      - "28082/tcp"
    volumes:
      - rust_data:/home/steam/rust
    environment:
      - RCON_PASSWORD
      - SERVER_HOSTNAME
      - SERVER_SEED
      - WORLD_SIZE
      - MAX_PLAYERS
      - SERVER_PORT
      - RCON_PORT
      - QUERY_PORT
      - APP_PORT
      - SERVER_IDENTITY
      - RUST_CARBON_ENABLED

volumes:
  rust_data:
