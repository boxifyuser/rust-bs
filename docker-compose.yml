services:
  rust-bs:
    build:
      context: https://github.com/boxifyuser/rust-bs.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    # Obrigatorio para servidor de jogo — ignore o aviso do Easypanel sobre ports
    ports:
      - "28015:28015/tcp"
      - "28015:28015/udp"
      - "28016:28016/tcp"
      - "28017:28017/udp"
      - "28082:28082/tcp"
    volumes:
      - rust_data:/home/steam/rust
    # Easypanel: variaveis da aba Environment sao repassadas pelo nome (sem ${})
    environment:
      - RCON_PASSWORD
      - SERVER_HOSTNAME
      - SERVER_SEED
      - WORLD_SIZE
      - MAX_PLAYERS
      - SERVER_PORT
      - RCON_PORT
      - QUERY_PORT
      - APP_PORT
      - SERVER_IDENTITY
      - RUST_CARBON_ENABLED
      - SERVER_PUBLIC_IP
      - STEAM_GSLT

volumes:
  rust_data:
